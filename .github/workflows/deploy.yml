name: Deploy to cyberfolks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_server_2:
        description: "Wdróż też na serwer 2 (domyślnie push wdraża tylko serwer 1)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        # npm ci is intentionally not used here: the lockfile was generated
        # with a newer npm than the one bundled with Node 20 on this runner,
        # and older npm mishandles bundleDependencies on the optional
        # @tailwindcss/oxide-wasm32-wasi package, wrongly reporting
        # @emnapi/runtime and @emnapi/core as missing. npm install tolerates
        # this and self-heals (same fix as deploy-finish.sh on the server).
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Dummy value: only needed so schema validation doesn't fail at
          # generate time. The real DATABASE_URL is only read at runtime,
          # on the server, from its own .env.
          DATABASE_URL: mysql://user:pass@localhost:3306/placeholder

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          # .next is a dot-directory, and upload-artifact v4 silently
          # excludes hidden files/dirs unless told otherwise — without this
          # the step reports "No files were found" even though .next is
          # fully populated (confirmed via the debug step above).
          include-hidden-files: true
          # Default behavior is to warn (and still exit 0) when no files
          # match — that hides a broken build behind a green checkmark and
          # only surfaces as a confusing "artifact not found" in the deploy
          # job. Fail loudly here instead, where the real cause is visible.
          if-no-files-found: error

  deploy-server-1:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Sync source on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_DIR,NODEVENV_DIR
          script: bash "$APP_DIR/deploy/deploy-pull.sh"
        env:
          APP_DIR: ${{ vars.APP_DIR }}
          NODEVENV_DIR: ${{ vars.NODEVENV_DIR }}

      - name: Set up SSH for rsync
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload built .next to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_SSH_PORT }}" \
            .next/ "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}:${{ vars.APP_DIR }}/.next/"

      - name: Install deps and restart app on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_DIR,NODEVENV_DIR
          script: bash "$APP_DIR/deploy/deploy-finish.sh"
        env:
          APP_DIR: ${{ vars.APP_DIR }}
          NODEVENV_DIR: ${{ vars.NODEVENV_DIR }}

  # Second, independent cyberfolks installation (own domain, own database,
  # own cron) — deployed from the same build artifact in parallel with
  # deploy-server-1 rather than rebuilding, since `next build` can't run on
  # either account directly (see the build job's comments) and CI minutes/
  # LVE limits make a second build wasteful. Uses its own secret/variable
  # names (DEPLOY2_*, *_2) so both servers' credentials coexist independently
  # in the repo's GitHub Actions settings.
  #
  # Unlike deploy-server-1, this job does NOT run on every push — only when
  # the workflow is triggered manually (Actions tab → Run workflow) with the
  # "deploy_server_2" checkbox ticked. A plain push to main only redeploys
  # server 1.
  deploy-server-2:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_server_2 == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Sync source on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY2_SSH_HOST }}
          port: ${{ secrets.DEPLOY2_SSH_PORT }}
          username: ${{ secrets.DEPLOY2_SSH_USER }}
          key: ${{ secrets.DEPLOY2_SSH_KEY }}
          envs: APP_DIR,NODEVENV_DIR
          script: bash "$APP_DIR/deploy/deploy-pull.sh"
        env:
          APP_DIR: ${{ vars.APP_DIR_2 }}
          NODEVENV_DIR: ${{ vars.NODEVENV_DIR_2 }}

      - name: Set up SSH for rsync
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY2_SSH_PORT }}" "${{ secrets.DEPLOY2_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload built .next to server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY2_SSH_PORT }}" \
            .next/ "${{ secrets.DEPLOY2_SSH_USER }}@${{ secrets.DEPLOY2_SSH_HOST }}:${{ vars.APP_DIR_2 }}/.next/"

      - name: Install deps and restart app on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY2_SSH_HOST }}
          port: ${{ secrets.DEPLOY2_SSH_PORT }}
          username: ${{ secrets.DEPLOY2_SSH_USER }}
          key: ${{ secrets.DEPLOY2_SSH_KEY }}
          envs: APP_DIR,NODEVENV_DIR
          script: bash "$APP_DIR/deploy/deploy-finish.sh"
        env:
          APP_DIR: ${{ vars.APP_DIR_2 }}
          NODEVENV_DIR: ${{ vars.NODEVENV_DIR_2 }}
